<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChannelVault</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #2e7d32;
      --accent-hover: #388e3c;
      --accent-light: #1b5e20;
      --danger: #c62828;
      --text: #e8eaf6;
      --muted: #7b7f9e;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .status-dot.online { background: #4caf50; box-shadow: 0 0 6px #4caf5088; }

    .status-label { color: var(--muted); font-size: 12px; margin-left: auto; }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .folder-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: var(--accent); }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    button:disabled { opacity: 0.45; cursor: default; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-secondary:hover:not(:disabled) { background: #363a50; }

    .btn-danger { background: var(--danger); color: #fff; }

    .msg {
      margin-top: 10px;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 5px;
      display: none;
    }
    .msg.show { display: block; }
    .msg.ok   { background: #1b5e2044; color: #a5d6a7; border: 1px solid #2e7d3244; }
    .msg.err  { background: #c6282822; color: #ef9a9a; border: 1px solid #c6282844; }

    .scan-log {
      margin-top: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      max-height: 180px;
      overflow-y: auto;
      display: none;
      line-height: 1.7;
    }
    .scan-log.show { display: block; }
    .scan-log .ok   { color: #a5d6a7; }
    .scan-log .skip { color: var(--muted); }
    .scan-log .err  { color: #ef9a9a; }

    .badge-wanted {
      display: inline-block;
      font-size: 10px;
      background: #0d47a1;
      color: #90caf9;
      border-radius: 3px;
      padding: 1px 6px;
      font-weight: 600;
    }

    .wanted-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .wanted-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
    }

    .wanted-item a {
      color: #90caf9;
      text-decoration: none;
      flex: 1;
      font-weight: 500;
    }
    .wanted-item a:hover { text-decoration: underline; }

    .ignored-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid #c6282833;
      border-radius: 6px;
      font-size: 13px;
    }

    .ignored-item a {
      color: #ef9a9a;
      text-decoration: none;
      flex: 1;
      font-weight: 500;
    }
    .ignored-item a:hover { text-decoration: underline; }

    .wanted-channel {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .stat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 16px;
      min-width: 110px;
    }

    .stat-num {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      text-align: left;
      padding: 8px 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      border-bottom: 1px solid var(--border);
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    tbody tr:hover { background: #ffffff06; }
    tbody tr:last-child { border-bottom: none; }

    td { padding: 9px 10px; vertical-align: middle; }

    .td-title { font-weight: 500; max-width: 260px; }
    .td-title a { color: var(--text); text-decoration: none; }
    .td-title a:hover { color: #90caf9; }
    .td-channel { color: var(--muted); }
    .td-mono { font-family: var(--mono); font-size: 11px; color: var(--muted); }
    .td-num { font-variant-numeric: tabular-nums; }

    .empty {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    .badge-dl {
      display: inline-block;
      font-size: 10px;
      background: var(--accent-light);
      color: #a5d6a7;
      border-radius: 3px;
      padding: 1px 6px;
      font-weight: 600;
    }

    .del-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 14px;
      transition: color 0.15s, background 0.15s;
    }
    .del-btn:hover { color: #ef9a9a; background: #c6282822; }

    .creator-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
    }

    .creator-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .creator-card:hover { border-color: var(--accent); }

    .creator-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .creator-count {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-hover);
      flex-shrink: 0;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="status-dot" id="dot"></div>
  <h1>ChannelVault</h1>
  <span class="status-label" id="status-label">Connecting…</span>
</header>

<main>

  <!-- Folder config -->
  <div class="card">
    <div class="card-title">Watch Folder</div>
    <div class="folder-row">
      <input type="text" id="folder-input" placeholder="/home/user/Downloads" />
      <button class="btn-secondary" id="btn-browse">Browse…</button>
      <button class="btn-secondary" id="btn-save">Save</button>
      <button class="btn-primary" id="btn-scan">Scan Now</button>
    </div>
    <div class="msg" id="folder-msg"></div>
    <div class="scan-log" id="scan-log"></div>
  </div>

  <!-- Wanted -->
  <div class="card" id="wanted-card">
    <div class="card-title">Download Wishlist</div>
    <div id="wanted-wrap"><div class="empty">No videos in wishlist.</div></div>
  </div>

  <!-- Ignored -->
  <div class="card" id="ignored-card">
    <div class="card-title" style="color:#ef9a9a;">Not Interested</div>
    <div id="ignored-wrap"><div class="empty">No ignored videos.</div></div>
  </div>

  <!-- Creators -->
  <div class="card">
    <div class="card-title">Videos per Creator</div>
    <div id="creators-wrap"><div class="empty">No data yet.</div></div>
  </div>

  <!-- Video list -->
  <div class="card">
    <div class="card-title">Tracked Videos</div>
    <div class="stats-row">
      <div class="stat">
        <div class="stat-num" id="stat-total">—</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-with-stats">—</div>
        <div class="stat-label">With stats</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-wanted" style="color:#90caf9;">—</div>
        <div class="stat-label">Wanted</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-ignored" style="color:#ef9a9a;">—</div>
        <div class="stat-label">Ignored</div>
      </div>
    </div>
    <div class="search-row">
      <input type="text" id="search" placeholder="Filter by title or channel…" style="max-width:320px;" />
    </div>
    <div id="table-wrap"></div>
  </div>

</main>

<script>
const API = "http://localhost:3360";
let allVideos = [];

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

async function boot() {
  try {
    const [cfg, videos, wanted, ignored] = await Promise.all([
      fetch(`${API}/config`).then(r => r.json()),
      fetch(`${API}/videos`).then(r => r.json()),
      fetch(`${API}/wanted`).then(r => r.json()),
      fetch(`${API}/ignored`).then(r => r.json()),
    ]);
    document.getElementById("dot").classList.add("online");
    document.getElementById("status-label").textContent = "Backend connected";
    document.getElementById("folder-input").value = cfg.watch_directory || "";
    allVideos = videos;
    renderTable(videos);
    updateStats(videos, wanted, ignored);
    renderWanted(wanted);
    renderIgnored(ignored);
  } catch (_) {
    document.getElementById("status-label").textContent = "Backend offline";
  }
}

// ---------------------------------------------------------------------------
// Folder save
// ---------------------------------------------------------------------------

document.getElementById("btn-browse").addEventListener("click", async () => {
  const btn = document.getElementById("btn-browse");
  const msg = document.getElementById("folder-msg");
  btn.disabled = true;
  btn.textContent = "Opening…";
  try {
    const res  = await fetch(`${API}/browse`);
    const data = await res.json();
    if (data.ok && data.directory) {
      document.getElementById("folder-input").value = data.directory;
      // auto-save
      const save = await fetch(`${API}/config`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ watch_directory: data.directory }),
      });
      const saved = await save.json();
      if (saved.ok) {
        showMsg(msg, `Watching: ${saved.watch_directory}`, "ok");
      } else {
        showMsg(msg, saved.error, "err");
      }
    }
  } catch (_) {
    showMsg(msg, "Request failed — is the backend running?", "err");
  }
  btn.disabled = false;
  btn.textContent = "Browse…";
});

document.getElementById("btn-save").addEventListener("click", async () => {
  const dir = document.getElementById("folder-input").value.trim();
  const msg = document.getElementById("folder-msg");
  try {
    const res = await fetch(`${API}/config`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ watch_directory: dir }),
    });
    const data = await res.json();
    if (data.ok) {
      showMsg(msg, `Watching: ${data.watch_directory}`, "ok");
    } else {
      showMsg(msg, data.error, "err");
    }
  } catch (e) {
    showMsg(msg, "Request failed — is the backend running?", "err");
  }
});

// ---------------------------------------------------------------------------
// Scan
// ---------------------------------------------------------------------------

document.getElementById("btn-scan").addEventListener("click", async () => {
  const btn = document.getElementById("btn-scan");
  const log = document.getElementById("scan-log");
  btn.disabled = true;
  btn.textContent = "Scanning…";
  log.innerHTML = "";
  log.classList.add("show");

  try {
    const res = await fetch(`${API}/scan`, { method: "POST" });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      log.innerHTML = `<span class="err">${data.error || "Scan failed"}</span>`;
      btn.disabled = false;
      btn.textContent = "Scan Now";
      return;
    }

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let   buf     = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split("\n\n");
      buf = lines.pop();

      for (const chunk of lines) {
        const line = chunk.trim();
        if (!line.startsWith("data:")) continue;
        let evt;
        try { evt = JSON.parse(line.slice(5).trim()); } catch { continue; }

        if (evt.type === "start") {
          log.innerHTML = `<span class="ok">Found ${evt.total} file(s) — scanning…</span>\n`;

        } else if (evt.type === "progress") {
          // Update the progress line (last child if it's a progress line, else append)
          const pct    = Math.round((evt.done / evt.total) * 100);
          const progId = "scan-progress-line";
          let   progEl = document.getElementById(progId);
          if (!progEl) {
            progEl    = document.createElement("span");
            progEl.id = progId;
            log.appendChild(document.createTextNode("\n"));
            log.appendChild(progEl);
          }
          progEl.className   = "ok";
          progEl.textContent = `  [${evt.done}/${evt.total}] ${pct}% — tracked: ${evt.tracked}  skipped: ${evt.skipped}  errors: ${evt.errors}`;
          log.scrollTop = log.scrollHeight;

        } else if (evt.type === "done") {
          const progEl = document.getElementById("scan-progress-line");
          if (progEl) progEl.remove();
          log.innerHTML += `<span class="ok">Done — ${evt.total} file(s): ${evt.tracked} tracked, ${evt.skipped} skipped, ${evt.errors} errors</span>\n`;
          log.scrollTop  = log.scrollHeight;

          const [videos, wanted, ignored] = await Promise.all([
            fetch(`${API}/videos`).then(r => r.json()),
            fetch(`${API}/wanted`).then(r => r.json()),
            fetch(`${API}/ignored`).then(r => r.json()),
          ]);
          allVideos = videos;
          renderTable(filterVideos(document.getElementById("search").value));
          updateStats(videos, wanted, ignored);
          renderWanted(wanted);
          renderIgnored(ignored);
        }
      }
    }
  } catch (e) {
    log.innerHTML += `<span class="err">Request failed — is the backend running?</span>`;
  }

  btn.disabled = false;
  btn.textContent = "Scan Now";
});

// ---------------------------------------------------------------------------
// Table
// ---------------------------------------------------------------------------

function filterVideos(query) {
  const q = query.toLowerCase();
  if (!q) return allVideos;
  return allVideos.filter(v =>
    (v.title || "").toLowerCase().includes(q) ||
    (v.channel_name || "").toLowerCase().includes(q)
  );
}

function fmt(n) {
  if (n == null) return "—";
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + "M";
  if (n >= 1_000)     return (n / 1_000).toFixed(1) + "K";
  return n.toString();
}

function fmtDate(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleDateString("en-CA");
}

function fmtDuration(secs) {
  if (!secs) return "—";
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = Math.floor(secs % 60);
  if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${m}:${String(s).padStart(2,"0")}`;
}

function renderTable(videos) {
  const wrap = document.getElementById("table-wrap");
  if (!videos.length) {
    wrap.innerHTML = `<div class="empty">No videos tracked yet. Run a scan or download a video.</div>`;
    return;
  }

  const rows = videos.map(v => `
    <tr>
      <td class="td-title">
        <a href="https://www.youtube.com/watch?v=${v.video_id}" target="_blank">${esc(v.title || v.video_id)}</a>
      </td>
      <td class="td-channel">${esc(v.channel_name || "—")}</td>
      <td class="td-mono">${fmtDuration(v.duration_secs)}</td>
      <td class="td-num">${fmt(v.view_count)}</td>
      <td class="td-num">${fmt(v.like_count)}</td>
      <td>${fmtDate(v.downloaded_at)}</td>
      <td>
        <button class="del-btn" title="Remove from vault" onclick="deleteVideo('${v.video_id}', this)">✕</button>
      </td>
    </tr>
  `).join("");

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Channel</th>
          <th>Duration</th>
          <th>Views</th>
          <th>Likes</th>
          <th>Downloaded</th>
          <th></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function updateStats(videos, wanted, ignored) {
  document.getElementById("stat-total").textContent      = videos.length;
  document.getElementById("stat-with-stats").textContent = videos.filter(v => v.view_count != null).length;
  if (wanted  !== undefined) document.getElementById("stat-wanted").textContent  = wanted.length;
  if (ignored !== undefined) document.getElementById("stat-ignored").textContent = ignored.length;
  renderCreators(videos);
}

function renderWanted(wanted) {
  const wrap = document.getElementById("wanted-wrap");
  if (!wanted || !wanted.length) {
    wrap.innerHTML = `<div class="empty">No videos in wishlist.</div>`;
    return;
  }
  wrap.innerHTML = `<div class="wanted-list">${
    wanted.map(v => `
      <div class="wanted-item" data-id="${v.video_id}">
        <a href="https://www.youtube.com/watch?v=${v.video_id}" target="_blank">${esc(v.title || v.video_id)}</a>
        <span class="wanted-channel">${esc(v.channel_name || "—")}</span>
        <button class="del-btn" title="Remove from wishlist" onclick="removeMark('${v.video_id}', this, 'wanted')">✕</button>
      </div>
    `).join("")
  }</div>`;
}

function renderIgnored(ignored) {
  const wrap = document.getElementById("ignored-wrap");
  if (!ignored || !ignored.length) {
    wrap.innerHTML = `<div class="empty">No ignored videos.</div>`;
    return;
  }
  wrap.innerHTML = `<div class="wanted-list">${
    ignored.map(v => `
      <div class="ignored-item" data-id="${v.video_id}">
        <a href="https://www.youtube.com/watch?v=${v.video_id}" target="_blank">${esc(v.title || v.video_id)}</a>
        <span class="wanted-channel">${esc(v.channel_name || "—")}</span>
        <button class="del-btn" title="Remove from ignored" onclick="removeMark('${v.video_id}', this, 'ignored')">✕</button>
      </div>
    `).join("")
  }</div>`;
}

async function removeMark(videoId, btn, type) {
  btn.disabled = true;
  try {
    await fetch(`${API}/mark/${videoId}`, { method: "DELETE" });
    const [wanted, ignored] = await Promise.all([
      fetch(`${API}/wanted`).then(r => r.json()),
      fetch(`${API}/ignored`).then(r => r.json()),
    ]);
    renderWanted(wanted);
    renderIgnored(ignored);
    document.getElementById("stat-wanted").textContent  = wanted.length;
    document.getElementById("stat-ignored").textContent = ignored.length;
  } catch (_) {
    btn.disabled = false;
  }
}

function renderCreators(videos) {
  const wrap = document.getElementById("creators-wrap");
  if (!videos.length) {
    wrap.innerHTML = `<div class="empty">No data yet.</div>`;
    return;
  }

  const counts = {};
  for (const v of videos) {
    const ch = v.channel_name || "Unknown";
    counts[ch] = (counts[ch] || 0) + 1;
  }

  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  wrap.innerHTML = `<div class="creator-grid">${
    sorted.map(([name, count]) => `
      <div class="creator-card" onclick="filterByCreator(${JSON.stringify(esc(name))})">
        <span class="creator-name" title="${esc(name)}">${esc(name)}</span>
        <span class="creator-count">${count}</span>
      </div>
    `).join("")
  }</div>`;
}

function filterByCreator(name) {
  const search = document.getElementById("search");
  search.value = name;
  renderTable(filterVideos(name));
  search.scrollIntoView({ behavior: "smooth", block: "center" });
}

document.getElementById("search").addEventListener("input", e => {
  renderTable(filterVideos(e.target.value));
});

// ---------------------------------------------------------------------------
// Delete
// ---------------------------------------------------------------------------

async function deleteVideo(videoId, btn) {
  btn.disabled = true;
  try {
    await fetch(`${API}/videos/${videoId}`, { method: "DELETE" });
    allVideos = allVideos.filter(v => v.video_id !== videoId);
    renderTable(filterVideos(document.getElementById("search").value));
    updateStats(allVideos, undefined, undefined);
  } catch (_) {
    btn.disabled = false;
  }
}

// ---------------------------------------------------------------------------
// Utils
// ---------------------------------------------------------------------------

function showMsg(el, text, type) {
  el.textContent = text;
  el.className   = `msg show ${type}`;
  setTimeout(() => el.classList.remove("show"), 4000);
}

function esc(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

boot();
</script>
