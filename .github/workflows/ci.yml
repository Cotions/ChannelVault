name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# The token only needs to read the repo; artifacts upload with that alone.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"   # keep in step with frontend/package.json packageManager

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Lint backend
        run: |
          python -m pip install --quiet pyflakes==3.2.0
          python -m pyflakes backend/*.py scripts/*.py

      - name: Install UI dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Lint UI
        working-directory: frontend
        run: bun run lint

      - name: Build the bundle
        run: ./bundle.sh

      - name: Smoke test the binary
        run: ./scripts/smoke_test.sh ./dist/channelvault

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: channelvault-linux-x86_64-dev
          path: dist/channelvault
          retention-days: 7
