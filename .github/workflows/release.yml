name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write        # publish the release
  id-token: write        # sign the provenance attestation
  attestations: write    # store it

jobs:
  release:
    # 22.04 keeps the glibc requirement low, so the binary runs on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: v
        env:
          # Never expand ${{ }} inside run: text; an env var cannot break out of quoting.
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo "bad tag: $TAG"; exit 1; }
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"   # keep in step with frontend/package.json packageManager

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Stamp the version
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          sed -i "s|^__version__     = .*|__version__     = \"$V\"|" backend/tracker.py
          grep -n '^__version__' backend/tracker.py

      - name: Install UI dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build the bundle
        run: ./bundle.sh

      - name: Package
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          NAME="channelvault-${V}-linux-x86_64"
          mkdir -p "release/$NAME"
          cp dist/channelvault "release/$NAME/channelvault"
          cp README.md "release/$NAME/README.md"
          cp packaging/channelvault.svg "release/$NAME/channelvault.svg"
          cp packaging/ChannelVault.desktop "release/$NAME/ChannelVault.desktop.template"
          cp userscript/channelvault.user.js "release/$NAME/channelvault.user.js"
          tar -czf "release/${NAME}.tar.gz" -C release "$NAME"
          cp dist/channelvault "release/channelvault-linux-x86_64"
          cd release
          sha256sum channelvault-linux-x86_64 "${NAME}.tar.gz" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify the built binary
        run: ./dist/channelvault --version

      # Signed statement that these exact bytes came out of this workflow run.
      # Anyone can check it with:  gh attestation verify <file> --repo <owner/repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            release/channelvault-linux-x86_64
            release/channelvault-*.tar.gz

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          name: ChannelVault ${{ steps.v.outputs.version }}
          generate_release_notes: true
          draft: false
          body: |
            ## Install (Linux x86_64)

            ```bash
            curl -L -o channelvault \
              https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.version }}/channelvault-linux-x86_64
            chmod +x channelvault
            ./channelvault
            ```

            The dashboard opens at http://localhost:3360. Nothing else to install — the
            binary carries its own Python runtime, the backend and the dashboard UI.

            Config lives at `~/.config/channelvault/config.json`; your database goes
            wherever you point `data_directory` in the dashboard.

            Install `zenity` if you want the folder-picker buttons to work
            (`sudo apt install zenity`).

            Verify your download against `SHA256SUMS.txt`, or prove it was built by this
            repository's CI (needs the GitHub CLI):

            ```bash
            gh attestation verify channelvault-linux-x86_64 --repo ${{ github.repository }}
            ```
          files: |
            release/channelvault-linux-x86_64
            release/channelvault-*.tar.gz
            release/SHA256SUMS.txt
